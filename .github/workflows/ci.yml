name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Build, Lint & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and check Python syntax
        run: |
          python -m py_compile backend/*.py

      - name: Set up Node.js for frontend checks
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify JavaScript syntax
        run: |
          node --check frontend/auth.js
          node --check frontend/user-menu.js
          node --check frontend/workbench.js

      - name: Run Database & Academic Profile Test Suite
        run: |
          python backend/test_database.py

      - name: Run Cloud Circuit Projects Test Suite
        run: |
          python backend/test_cloud_circuits.py
